[project]
name = "risktwin-ml-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "lightgbm>=4.7.0",
    "numba>=0.68.0",
    "numpy>=2.4.6",
    "ortools>=9.8",
    "pandas>=3.0.6",
    "protobuf>=7.36.2",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "shap>=0.49.1",
    "torch>=2.14.1",
]

[project.scripts]
proto = "generate_proto:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
